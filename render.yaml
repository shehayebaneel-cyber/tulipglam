# Render Blueprint — TulipGlam
# One web service builds the React app + runs the Express API, which also serves
# the built site (server/src/index.ts has the web/dist fallthrough).
# Database is Neon Postgres — set the URLs + secrets in the Render dashboard.
services:
  - type: web
    name: tulipglam
    runtime: node
    plan: free # upgrade to "starter" ($7) to remove cold-starts once selling
    region: ohio # Neon is us-east-2 (Ohio)
    branch: main
    # --include=dev forces the build tools (vite, tsc, tsx, prisma) to install
    # even though Render sets NODE_ENV=production.
    buildCommand: >-
      cd server && npm install --include=dev && npx prisma generate &&
      cd ../web && npm install --include=dev && npm run build
    startCommand: cd server && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon pooled URL (…-pooler…?sslmode=require&pgbouncer=true)
      - key: DIRECT_URL
        sync: false # Neon direct URL (no -pooler, ?sslmode=require)
      - key: ADMIN_KEY
        sync: false # admin dashboard password (in server/.env locally)
      - key: JWT_SECRET
        sync: false # customer login token secret
      # ---- coming-soon gate (see LAUNCH.md) ----
      # "true" puts the whole site behind web/public/coming-soon.html. Any other value is off.
      # This is the single switch that launches the store; nothing else changes.
      #
      # DEFAULTS TO "true", AND THAT IS DELIBERATE. It used to say "false".
      #
      # A blueprint `value:` is reapplied on every sync, so the old default meant any re-sync
      # would silently switch the gate OFF and publish an unfinished store — undoing, without a
      # deploy log anyone would read, the one rule that outranks everything else here.
      # LAUNCH.md turns the gate on from the dashboard, which is right; the blueprint simply must
      # not hold an opinion that can overrule it in the dangerous direction.
      #
      # Failure directions are not symmetric. Re-gating a live store is an outage you notice in
      # seconds and fix with one dashboard toggle. Un-gating an unfinished one is not recoverable
      # — you cannot un-see a half-built shop, and search engines index fast.
      #
      # On a first deploy this makes the service REFUSE TO BOOT until PREVIEW_KEY is set. That is
      # the designed behaviour, not a bug (LAUNCH.md says so): a gate with no way past it is a
      # mistake the server declines to make.
      - key: COMING_SOON
        value: "true"
      # Lets one browser through the gate via /?preview=<key>. Required only while the gate is
      # on — the server refuses to start with it missing or under 24 characters, because a
      # guessable key is a public bypass. Generate:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      - key: PREVIEW_KEY
        sync: false
