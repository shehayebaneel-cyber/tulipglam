<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FCFCFB" />
    <!--
      Defaults only. In production the server replaces the title and description below and adds
      canonical / Open Graph / JSON-LD per page (server/src/seo.ts) — a client-side app shows
      one title to any crawler that doesn't run JavaScript, and WhatsApp's link preview crawler
      doesn't. These stay as the fallback for the dev server and for a static preview.

      Do not write an HTML tag name inside angle brackets in this comment. injectHead() strips
      the existing title and description by pattern, and a tag written here would be a second
      thing for it to match.
    -->
    <meta name="description" content="TulipGlam — premium beauty in Lebanon. Makeup, skincare, hair, fragrance & gift sets, delivered across Lebanon." />
    <title>TulipGlam — Premium Beauty · Lebanon</title>
    <meta property="og:site_name" content="TulipGlam" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TulipGlam — Premium Beauty · Lebanon" />
    <meta property="og:description" content="Premium makeup, skincare, hair and fragrance, delivered across Lebanon. Cash on delivery." />
    <meta name="twitter:card" content="summary" />
    <!-- Fonts are self-hosted (web/public/fonts, generated by server/scripts/selfhost-fonts.mjs).
         They used to load from fonts.googleapis.com, which put two DNS lookups and two TLS
         handshakes on the render-blocking path before a single word could appear.
         Preloaded because the body face is needed by the very first paint; the display face is
         not, so it is left to load normally. -->
    <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
